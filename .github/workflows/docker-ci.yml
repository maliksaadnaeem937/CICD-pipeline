name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 3️⃣ Build Docker image with version (commit SHA)
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ci-cd-node-app:${{ github.sha }} .

      # 4️⃣ Tag image as latest
      - name: Tag image
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/ci-cd-node-app:${{ github.sha }} \
                     ${{ secrets.DOCKER_USERNAME }}/ci-cd-node-app:latest

      # 5️⃣ Push both images to Docker Hub
      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-node-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-node-app:latest